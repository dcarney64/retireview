server {
  listen 80;

  # index.html — never cache; the browser must always re-fetch it so the
  # correct (cache-busted) JS/CSS bundle hashes are picked up after deploys.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Hashed static assets (JS/CSS bundles) — cache forever; they get a new
  # filename on every build so stale content is impossible.
  location ~* \.(js|css)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else (images, fonts, favicon, etc.) — moderate caching.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=86400";
  }

  location /api/ {
    proxy_pass http://backend:8006/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
